<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>บัญชีรายรับรายจ่าย</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #18181b;
      --muted: #64748b;
      --border: #18181b;
      --bw: 2.5px;
      --rad: 22px;
      --rad-sm: 14px;
      --rad-pill: 999px;

      /* Colors matching the reference image */
      --blue: #38bdf8;
      --blue-dark: #0284c7;
      --blue-soft: #e0f2fe;

      --yellow: #facc15;
      --yellow-dark: #eab308;
      --yellow-soft: #fef9c3;

      --coral: #fb7185;
      --coral-soft: #ffe4e6;
      --orange: #fb923c;
      --orange-soft: #ffedd5;

      --inc: #34d399;
      --inc-soft: #d1fae5;
      --exp: #f87171;
      --exp-soft: #fee2e2;

      --pri: #facc15;
      --pri-text: #18181b;

      --shadow: 4px 4px 0 #18181b;
      --shadow-sm: 2px 2px 0 #18181b;
      --shadow-lg: 6px 6px 0 #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      max-width: 100vw;
      overflow-x: hidden;
      position: relative;
    }

    body {
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background-color: #f7f9fc;
      background-image: 
        radial-gradient(circle at 12% 18%, rgba(56, 189, 248, 0.08) 0%, transparent 28%),
        radial-gradient(circle at 88% 82%, rgba(250, 204, 21, 0.1) 0%, transparent 30%),
        radial-gradient(circle at 50% 45%, rgba(251, 113, 133, 0.06) 0%, transparent 35%);
      background-attachment: fixed;
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ================= SIDEBAR (DESKTOP) ================= */
    .sidebar {
      width: 240px;
      background: #ffffff;
      border-right: var(--bw) solid var(--border);
      color: var(--text);
      padding: 20px 14px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 2px 0 0 rgba(24, 24, 27, 0.03);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 16px;
      margin-bottom: 8px;
      border-bottom: 2px dashed #e2e8f0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
      min-width: 0;
    }

    .brand-icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-text span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .brand small {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
    }

    .collapse-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .collapse-btn:hover {
      background: var(--yellow);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--border);
    }

    .collapse-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border);
    }

    #nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--rad-pill);
      color: #334155;
      cursor: pointer;
      border: 2px solid transparent;
      background: none;
      font: inherit;
      font-weight: 600;
      text-align: left;
      position: relative;
      width: 100%;
      transition: all 0.15s ease;
    }

    .nav-icon {
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      flex-shrink: 0;
    }

    .nav:hover {
      background: #f1f5f9;
      border-color: var(--border);
      transform: translateY(-1px);
    }

    .nav.active {
      background: var(--yellow);
      color: var(--text);
      font-weight: 800;
      border-color: var(--border);
      box-shadow: var(--shadow-sm);
    }

    .nav .dot {
      margin-left: auto;
      background: var(--coral);
      color: #fff;
      border: 1.5px solid var(--border);
      border-radius: var(--rad-pill);
      font-size: 11px;
      padding: 1px 7px;
      font-weight: 700;
    }

    .sidebar-footer {
      padding-top: 10px;
      border-top: 2px dashed #e2e8f0;
      margin-top: auto;
    }

    /* Collapsed Sidebar State (Desktop) */
    body.sidebar-collapsed .sidebar {
      width: 76px;
      padding: 20px 10px;
    }

    body.sidebar-collapsed .brand-wrap {
      justify-content: center;
      padding-bottom: 12px;
    }

    body.sidebar-collapsed .brand-text {
      display: none;
    }

    body.sidebar-collapsed .nav {
      justify-content: center;
      padding: 11px 0;
    }

    body.sidebar-collapsed .nav .txt {
      display: none;
    }

    body.sidebar-collapsed .nav .dot {
      position: absolute;
      top: 2px;
      right: 6px;
      margin-left: 0;
      padding: 1px 5px;
      font-size: 10px;
    }

    body.sidebar-collapsed .sidebar-footer-txt {
      display: none;
    }

    body.sidebar-collapsed main {
      margin-left: 76px;
    }

    /* ================= MAIN CONTENT ================= */
    main {
      margin-left: 240px;
      padding: 24px 28px 80px;
      min-width: 0;
      max-width: 100vw;
      box-sizing: border-box;
      transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Topbar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      background: var(--card);
      border: var(--bw) solid var(--border);
      border-radius: var(--rad);
      box-shadow: var(--shadow);
      padding: 14px 20px;
    }

    .topbar h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .tools {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Inputs, Selects, Textareas */
    input,
    select,
    textarea {
      font: inherit;
      padding: 9px 14px;
      border: 2px solid var(--border);
      border-radius: var(--rad-sm);
      background: #fff;
      color: var(--text);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      width: 100%;
      transition: all 0.15s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--blue-dark);
      background: #f0f9ff;
      box-shadow: 3px 3px 0 var(--blue-dark);
    }

    .tools input {
      width: auto;
      border-radius: var(--rad-pill);
    }

    /* Buttons */
    .btn {
      font: inherit;
      border: 2px solid var(--border);
      border-radius: var(--rad-pill);
      padding: 8px 18px;
      cursor: pointer;
      font-weight: 700;
      background: #fff;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--border);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--border);
    }

    .btn.primary {
      background: var(--yellow);
      color: var(--text);
    }

    .btn.secondary {
      background: var(--blue);
      color: var(--text);
    }

    .btn.ghost {
      background: #f8fafc;
      color: var(--muted);
    }

    .btn.sm {
      padding: 5px 12px;
      font-size: 12px;
    }

    .btn.danger {
      background: var(--coral);
      color: #fff;
    }

    .btn.ok {
      background: var(--inc);
      color: var(--text);
    }

    /* Grid Layouts */
    .grid {
      display: grid;
      gap: 16px;
      margin-bottom: 18px;
    }

    .g6 {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    .g2 {
      grid-template-columns: 2fr 1fr;
    }

    .g11 {
      grid-template-columns: 1fr 1fr;
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    /* Cards */
    .card {
      background: var(--card);
      border: var(--bw) solid var(--border);
      border-radius: var(--rad);
      padding: 20px;
      box-shadow: var(--shadow);
      min-width: 0;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card h3 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 10px;
    }

    /* KPI Cards */
    .kpi {
      background: #ffffff;
      border: var(--bw) solid var(--border);
      border-radius: var(--rad);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .kpi::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: var(--c, var(--yellow));
      border-bottom: 1.5px solid var(--border);
    }

    .kpi .lbl {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .kpi .val {
      font-size: 24px;
      font-weight: 800;
      margin: 6px 0;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .kpi .chg {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .up {
      color: #059669 !important;
      font-weight: 700;
    }

    .down {
      color: #e11d48 !important;
      font-weight: 700;
    }

    /* Charts */
    .chart {
      position: relative;
      height: 280px;
    }

    .chart.sm {
      height: 230px;
    }

    /* Tables */
    .tbl {
      overflow-x: auto;
      max-height: 560px;
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th,
    td {
      padding: 11px 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
      font-size: 13px;
    }

    th {
      font-size: 12px;
      color: var(--text);
      font-weight: 800;
      background: #f8fafc;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .num {
      text-align: right !important;
    }

    tr:hover td {
      background: #fdfaf6;
    }

    tfoot td {
      font-weight: 800;
      background: #f8fafc;
      border-top: 2px solid var(--border);
      border-bottom: none;
    }

    .clickable-row {
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(250, 204, 21, 0.25);
    }

    .clickable-row:hover td {
      background: #fef9c3 !important;
    }

    .clickable-row:active td {
      background: #fde047 !important;
    }

    .tbl-hint {
      display: none;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      padding: 8px 12px;
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      user-select: none;
    }

    .col-show-sm {
      display: none;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: var(--rad-pill);
      font-size: 12px;
      font-weight: 700;
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .b-red {
      background: var(--exp-soft);
      color: #991b1b;
    }

    .b-orange {
      background: var(--orange-soft);
      color: #9a3412;
    }

    .b-yellow {
      background: var(--yellow-soft);
      color: #854d0e;
    }

    .b-green {
      background: var(--inc-soft);
      color: #166534;
    }

    .b-blue {
      background: var(--blue-soft);
      color: #0369a1;
    }

    .b-gray {
      background: #f1f5f9;
      color: #334155;
    }

    .bar {
      height: 10px;
      background: #f1f5f9;
      border: 1.5px solid var(--border);
      border-radius: var(--rad-pill);
      overflow: hidden;
      min-width: 80px;
    }

    .bar>i {
      display: block;
      height: 100%;
      border-radius: var(--rad-pill);
      background: var(--c, var(--yellow));
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 2px dashed #e2e8f0;
    }

    .item:last-child {
      border: 0;
    }

    .item .t {
      flex: 1;
      min-width: 0;
    }

    .item small {
      color: var(--muted);
      display: block;
      font-weight: 500;
    }

    /* Credit Card style matching reference cards */
    .cc {
      border-radius: var(--rad);
      padding: 22px;
      color: #18181b;
      background: linear-gradient(135deg, var(--c1, var(--blue-soft)), var(--c2, var(--yellow-soft)));
      border: var(--bw) solid var(--border);
      box-shadow: var(--shadow);
      min-height: 175px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filters>* {
      width: auto;
      min-width: 130px;
    }

    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .chip {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: var(--rad-sm);
      padding: 8px 14px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .chip b {
      display: block;
      font-size: 16px;
      color: var(--text);
      font-weight: 800;
    }

    /* Modals */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border: 3px solid var(--border);
      border-radius: 26px;
      box-shadow: var(--shadow-lg);
      padding: 24px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-box h3 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .modal-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }

    .modal-box-header h3 {
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
    }

    .modal-box-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--coral);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 var(--border);
      flex-shrink: 0;
      transition: transform 0.1s;
    }

    .modal-box-close:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--border);
    }

    .modal-box-close:active {
      transform: translate(1px, 1px);
      box-shadow: 0 0 0 var(--border);
    }

    .detail-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
      background: #fff;
    }

    .detail-table th,
    .detail-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
      white-space: normal;
      word-break: break-word;
    }

    .detail-table th {
      width: 38%;
      color: #475569;
      font-weight: 700;
      background: #f8fafc;
      text-align: left;
      border-right: 1.5px solid var(--border);
      position: static;
      vertical-align: top;
    }

    .detail-table td {
      font-weight: 600;
      color: var(--text);
    }

    .detail-table tr:last-child th,
    .detail-table tr:last-child td {
      border-bottom: none;
    }

    #mForm {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    #mForm label span {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .full {
      grid-column: 1/-1;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translate(-50%, 140px);
      background: #18181b;
      color: #fff;
      padding: 11px 22px;
      border-radius: var(--rad-pill);
      border: 2px solid #38bdf8;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-weight: 700;
      font-size: 13px;
      transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 150;
      pointer-events: none;
    }

    #toast.show {
      transform: translate(-50%, 0);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tabs .btn {
      background: #fff;
      color: var(--muted);
    }

    .tabs .btn.on {
      background: var(--yellow);
      color: var(--text);
      font-weight: 800;
    }

    .tip {
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--rad-sm);
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 28px;
      font-weight: 600;
    }

    .set-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .set-grid label span {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    /* ================= MOBILE FLOATING MENU (FAB) ================= */
    .mobile-fab {
      display: none;
    }

    .mobile-menu-backdrop {
      display: none;
    }

    /* Responsive / Mobile Breakpoints */
    @media (max-width: 1000px) {
      .g2,
      .g11 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      /* Hide desktop sidebar */
      .sidebar {
        display: none !important;
      }

      main {
        margin-left: 0 !important;
        padding: 14px 12px 100px !important;
        width: 100% !important;
        max-width: 100vw !important;
        box-sizing: border-box !important;
      }

      .topbar {
        padding: 12px 14px;
        gap: 10px;
      }

      .topbar h1 {
        font-size: 18px;
      }

      .tools {
        width: 100%;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tools input {
        flex: 1;
        min-width: 120px;
      }

      .tools .btn {
        flex: 0 0 auto;
      }

      .grid {
        gap: 10px;
        margin-bottom: 14px;
      }

      .g6 {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px !important;

  <script>
    /* ================= UTILITIES ================= */
    const $ = s => document.querySelector(s);
    const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const PAL = ['#38bdf8', '#facc15', '#fb7185', '#34d399', '#a78bfa', '#fb923c', '#0284c7', '#f43f5e', '#818cf8', '#eab308', '#14b8a6', '#64748b'];
    const GROUP = { 'ออมและลงทุน': 'save', 'ช้อปปิ้ง': 'want', 'บันเทิง': 'want', 'สมาชิกรายเดือน': 'want' };
    const FREQ = ['รายวัน', 'รายสัปดาห์', 'รายเดือน', 'รายครั้ง'];
    const fmt = n => (Math.round(n) || 0).toLocaleString('th-TH');
    const baht = n => '฿' + fmt(n);
    const kfmt = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('th-TH', { maximumFractionDigits: 1 }) + 'k' : v;
    const uid = () => Math.random().toString(36).slice(2, 10);
    const pad = n => String(n).padStart(2, '0');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1) };
    const ymOf = s => s.slice(0, 7);
    const dim = (y, m) => new Date(y, m, 0).getDate();
    const addYM = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}` };
    const dateIn = (ym, day) => { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(Math.min(+day, dim(y, m)))}` };
    const addMD = (s, k) => dateIn(addYM(ymOf(s), k), +s.slice(8, 10));
    const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
    const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${TH_M[m - 1]} ${y + 543}` };
    const ymShort = ym => { const [y, m] = ym.split('-').map(Number); return `${TH_M[m - 1]} ${String(y + 543).slice(2)}` };
    const dLabel = s => { if (!s) return '-'; const d = parse(s); return `${d.getDate()} ${TH_M[d.getMonth()]} ${String(d.getFullYear() + 543).slice(2)}` };
    const sum = (a, f = x => x.amount) => a.reduce((s, x) => s + (+f(x) || 0), 0);
    function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200) }

    /* ================= DATA ================= */
    const KEY = 'money-manager-v1', AUTH = 'money-key', CLOUD = location.protocol.startsWith('http');
    let S = load(), REV = +localStorage.getItem(KEY + '-rev') || 0, saveT = null;
    function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tx) return s } catch (e) { } return sample() }
    const dirty = v => v === undefined ? localStorage.getItem(KEY + '-dirty') === '1' : localStorage.setItem(KEY + '-dirty', v ? '1' : '0');
    function setSync(t, c) {
      const e = $('#sync');
      if (e) {
        e.textContent = t;
        e.className = 'badge ' + c;
        e.style.cursor = 'pointer';
        e.onclick = askKey;
      }
      const me = $('#mobileSyncStatus');
      if (me) me.textContent = t;
    }
    function save() {
      localStorage.setItem(KEY, JSON.stringify(S)); dirty(true);
      if (!CLOUD || !localStorage.getItem(AUTH)) return;
      setSync('⏳ กำลังบันทึก...', 'b-yellow'); clearTimeout(saveT); saveT = setTimeout(push, 800);
    }
    async function api(path, opt = {}) {
      const r = await fetch('/api/' + path, { ...opt, headers: { 'content-type': 'application/json', 'x-app-key': localStorage.getItem(AUTH) || '' } });
      if (r.status === 401) {
        localStorage.removeItem(AUTH);
        setSync('🔐 รหัสผ่านไม่ถูกต้อง (คลิกเพื่อเข้าสู่ระบบ)', 'b-red');
        toast('⚠️ รหัสผ่านไม่ถูกต้อง หรือยังไม่ได้ตั้งค่า APP_PIN บน Netlify');
        askKey();
        throw new Error('auth');
      }
      return r;
    }
    async function push(force) {
      saveT = null;
      try {
        const r = await api('data', { method: 'PUT', body: JSON.stringify({ rev: force ? null : REV, data: S }) });
        if (r.status === 409) {
          const j = await r.json();
          if (confirm('ข้อมูลบนคลาวด์ถูกแก้ไขจากอุปกรณ์อื่น\nตกลง = โหลดข้อมูลล่าสุดจากคลาวด์\nยกเลิก = ใช้ข้อมูลในเครื่องนี้เขียนทับ')) applyRemote(j); else await push(true); return
        }
        if (!r.ok) throw new Error(r.status);
        const j = await r.json(); REV = j.rev; localStorage.setItem(KEY + '-rev', REV); dirty(false); setSync('☁️ ซิงก์แล้ว', 'b-green');
      } catch (e) { if (e.message !== 'auth') setSync('⚠️ ออฟไลน์ (บันทึกในเครื่อง)', 'b-red') }
    }
    function applyRemote(j) { S = j.data; REV = j.rev; localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(KEY + '-rev', REV); dirty(false); render(); setSync('☁️ ซิงก์แล้ว', 'b-green') }
    async function pull() {
      if (!CLOUD) return setSync('📴 โหมดออฟไลน์', 'b-gray');
      if (!localStorage.getItem(AUTH)) {
        setSync('🔐 คลิกเพื่อเข้าสู่ระบบ', 'b-gray');
        return askKey();
      }
      setSync('⏳ กำลังโหลด...', 'b-yellow');
      try {
        const r = await api('data');
        if (r.status === 404) { await push(true); toast('อัปโหลดข้อมูลขึ้นคลาวด์ครั้งแรกแล้ว'); return }
        if (!r.ok) throw new Error(r.status);
        const j = await r.json();
        if (dirty()) {
          if (j.rev === REV) return push();
          if (confirm('มีการแก้ไขในเครื่องนี้ที่ยังไม่ซิงก์ และบนคลาวด์ก็มีการแก้ไขด้วย\nตกลง = ใช้ข้อมูลบนคลาวด์\nยกเลิก = ใช้ข้อมูลในเครื่องนี้เขียนทับ')) applyRemote(j); else push(true); return
        }
        if (j.rev !== REV) applyRemote(j); else setSync('☁️ ซิงก์แล้ว', 'b-green');
      } catch (e) { if (e.message !== 'auth') setSync('⚠️ ออฟไลน์ (บันทึกในเครื่อง)', 'b-red') }
    }
    function askKey() {
      if (!CLOUD) return;
      openForm('🔐 เข้าสู่ระบบ (ซิงก์ข้อมูลคลาวด์)', [
        { key: 'k', label: 'รหัสผ่านแอป (APP_PIN ที่ตั้งไว้ใน Netlify)', type: 'password', req: true, full: true, hint: 'กรอกรหัสเดียวกับตัวแปร APP_PIN ใน Netlify Site configuration' }
      ], {}, o => {
        localStorage.setItem(AUTH, o.k.trim());
        closeModal();
        pull();
      }, () => {
        const box = $('#mForm');
        if (box) {
          const cancelBtn = box.querySelector('.btn.ghost');
          if (cancelBtn) {
            cancelBtn.onclick = () => { closeModal(); setSync('📴 ใช้แบบออฟไลน์ (คลิกเพื่อเชื่อมต่อคลาวด์)', 'b-gray'); };
          }
        }
      });
    }
    function logout() { localStorage.removeItem(AUTH); setSync('📴 ออกจากระบบแล้ว (คลิกเพื่อเข้าสู่ระบบ)', 'b-gray'); askKey() }
    const today = () => S.settings.refDate || ymd(new Date());
    const methods = () => ['เงินสด', 'โอน', ...S.cards.map(c => c.name)];

    function sample() {
      const tx = []; const T = (date, type, nature, category, desc, freq, method, amount, note = '') => tx.push({ id: uid(), date, type, nature, category, desc, freq, method, amount, note });
      [['2026-07', 7000, 1000, 0, [8000, 3000, 1500, 1700, 0]], ['2026-08', 9500, 998, 419, [8500, 3200, 1600, 2000, 1500]], ['2026-09', 11000, 998, 419, [7500, 2500, 1350, 3750, 0]]]
        .forEach(([ym, side, comm, subs, v]) => {
          T(ym + '-01', 'รายรับ', '-', 'เงินเดือน', 'เงินเดือนประจำ', 'รายเดือน', 'โอน', 35000);
          T(ym + '-28', 'รายรับ', '-', 'ขายของออนไลน์', 'ยอดขายรวมทั้งเดือน', 'รายเดือน', 'โอน', side, 'ข้อมูลย้อนหลัง');
          T(ym + '-01', 'รายจ่าย', 'คงที่', 'ที่พัก', 'ค่าเช่าห้อง', 'รายเดือน', 'โอน', 7000);
          T(ym + '-01', 'รายจ่าย', 'คงที่', 'ออมและลงทุน', 'DCA กองทุนรวม', 'รายเดือน', 'โอน', 5000);
          T(ym + '-05', 'รายจ่าย', 'คงที่', 'สื่อสาร', 'ค่าเน็ตและโทรศัพท์', 'รายเดือน', 'โอน', comm);
          T(ym + '-10', 'รายจ่าย', 'คงที่', 'ประกัน', 'เบี้ยประกันชีวิต', 'รายเดือน', 'โอน', 2000);
          if (subs) T(ym + '-25', 'รายจ่าย', 'คงที่', 'สมาชิกรายเดือน', 'Netflix และ Spotify', 'รายเดือน', 'โอน', subs);

    function instCalc(i) {
      const total = Math.round(i.principal * (1 + (+i.rate || 0) / 100 * i.months)), per = Math.round(total / i.months), ref = today(), dues = [];
      for (let k = 0; k < i.months; k++)dues.push({ date: addMD(i.firstDue, k), amount: k === i.months - 1 ? total - per * (i.months - 1) : per, k });
      const done = dues.filter(d => d.date <= ref).length, paid = sum(dues.slice(0, done));
      return {
        ...i, total, per, dues, done, paid, remain: total - paid, left: i.months - done, next: dues[done]?.date || null, last: dues.at(-1).date,
        status: done === 0 ? 'ยังไม่เริ่มผ่อน' : done >= i.months ? 'ผ่อนครบแล้ว' : 'กำลังผ่อน'
      };
    }
    const instDues = () => S.inst.flatMap(i => instCalc(i).dues.map(d => ({ ...d, card: i.card, item: i.item, iid: i.id })));
    const instInMonth = (ym, card) => sum(instDues().filter(d => ymOf(d.date) === ym && (!card || d.card === card)));

    function monthAgg(ym) {
      let inc = 0, fix = 0, vari = 0;
      S.tx.forEach(t => { if (ymOf(t.date) !== ym) return; if (t.type === 'รายรับ') inc += t.amount; else if (t.nature === 'คงที่') fix += t.amount; else vari += t.amount });
      const inst = instInMonth(ym), exp = fix + vari + inst, net = inc - exp;
      return { ym, inc, fix, vari, inst, exp, net, rate: inc ? net / inc * 100 : 0 };
    }
    function ledger(until) {
      const out = []; let bal = +S.settings.opening || 0, ym = S.settings.startMonth, g = 0;
      while (ym <= until && g++ < 240) { const a = monthAgg(ym); a.open = bal; bal += a.net; a.close = bal; out.push(a); ym = addYM(ym, 1) }
      return out;
    }
    function ledgerTo(ym) {
      const L = ledger(ym);
      if (!L.length) { const a = monthAgg(ym); a.open = 0; a.close = a.net; return { list: [a], cur: a, prev: null } }
      return { list: L, cur: L.at(-1), prev: L.at(-2) || null };
    }
    function forecast(ym, list) {
      const last = list.slice(-3), avg = k => last.reduce((s, x) => s + x[k], 0) / (last.length || 1);
      const a = { ym, inc: Math.round(avg('inc')), fix: last.at(-1)?.fix || 0, vari: Math.round(avg('vari')), inst: instInMonth(ym), fc: true };
      a.exp = a.fix + a.vari + a.inst; a.net = a.inc - a.exp; a.rate = a.inc ? a.net / a.inc * 100 : 0; a.open = list.at(-1)?.close || 0; a.close = a.open + a.net; return a;
    }
    function catSpend(ym) { const m = {}; S.tx.forEach(t => { if (t.type === 'รายจ่าย' && ymOf(t.date) === ym) m[t.category] = (m[t.category] || 0) + t.amount }); return m }

    function stmtDue(c, date) {
      const ym = ymOf(date); let cut = dateIn(ym, c.cutoff); if (date > cut) cut = dateIn(addYM(ym, 1), c.cutoff);
      const cym = ymOf(cut); let due = dateIn(cym, c.due); if (due <= cut) due = dateIn(addYM(cym, 1), c.due); return due;
    }
    function cardPays(c) {
      const m = {}, add = (due, k, v) => { if (c.paidUntil && due <= c.paidUntil) return; (m[due] = m[due] || { due, full: 0, inst: 0 })[k] += v };
      S.tx.forEach(t => { if (t.type === 'รายจ่าย' && t.method === c.name) add(stmtDue(c, t.date), 'full', t.amount) });
      instDues().forEach(d => { if (d.card === c.name) add(d.date, 'inst', d.amount) });
      return Object.values(m).sort((a, b) => a.due < b.due ? -1 : 1);
    }

    function notifyCard() {
      const n = NS(), yn = (k, l) => `<label><span>${l}</span><select onchange="setN('${k}',this.value==='1')"><option value="1" ${n[k] ? 'selected' : ''}>เปิด</option><option value="0" ${!n[k] ? 'selected' : ''}>ปิด</option></select></label>`;
      return `<div class="card" style="margin-bottom:16px"><h3>💬 แจ้งเตือนผ่าน Google Chat <span class="badge ${CLOUD ? 'b-green' : 'b-gray'}">${CLOUD ? 'โหมดคลาวด์' : 'โหมดออฟไลน์'}</span></h3>
 <div class="set-grid">${yn('enabled', 'แจ้งเตือนครบกำหนดทุกวัน')}
 <label><span>แจ้งล่วงหน้า (วัน)</span><input type="number" min="0" max="30" value="${n.daysBefore}" onchange="setN('daysBefore',+this.value)"></label>
 ${yn('weekly', 'รายงานสัปดาห์ (ทุกวันจันทร์)')}${yn('monthly', 'รายงานเดือน (ทุกวันที่ 1)')}</div>
 <p class="hint" style="margin:10px 0">ระบบส่งทุกวันเวลา 08:00 น. แจ้งรายการที่เกินกำหนด ครบกำหนดวันนี้ และรายการที่จะครบกำหนดภายในจำนวนวันที่ตั้งไว้</p>
 <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">
 <button class="btn" onclick="sendNow('test')">🧪 ทดสอบการเชื่อมต่อ</button><button class="btn" onclick="sendNow('alerts')">🔔 ส่งแจ้งเตือนตอนนี้</button>
 <button class="btn" onclick="sendNow('weekly')">📅 ส่งรายงานสัปดาห์</button><button class="btn" onclick="sendNow('monthly')">📊 ส่งรายงานเดือน</button>
 ${CLOUD ? '<button class="btn ghost" onclick="logout()">ออกจากระบบ</button>' : ''}</div></div>`
    }
    const PAGES = {
      dash: ['📊', 'Dashboard', pgDash], tx: ['🧾', 'บันทึกรายการ', pgTx], inst: ['🗓️', 'ผ่อนบัตรเครดิต', pgInst], cards: ['💳', 'บัตรเครดิต', pgCards],
      alerts: ['🔔', 'แจ้งเตือน', pgAlerts], report: ['📈', 'รายงาน', pgReport], goals: ['🎯', 'เป้าหมายการออม', pgGoals], settings: ['⚙️', 'ตั้งค่า', pgSettings]
    };
    let page = 'dash', curYM;
    function go(p) {
      page = p;
      closeMobileMenu();
      render();
      window.scrollTo(0, 0);
    }
    function toggleSidebar() {
      document.body.classList.toggle('sidebar-collapsed');
      const isC = document.body.classList.contains('sidebar-collapsed');
      localStorage.setItem('mm-sidebar-collapsed', isC ? '1' : '0');
      const btn = $('#collapseBtn');
      if (btn) btn.textContent = isC ? '▶' : '◀';
    }
    function openMobileMenu() {
      $('#mobileMenuBackdrop').classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeMobileMenu() {
      const b = $('#mobileMenuBackdrop');
      if (b) b.classList.remove('show');
      document.body.style.overflow = '';
    }
    function renderNav() {
      const n = alerts().filter(a => a.days <= 7).length;
      // Desktop nav
      const dNav = $('#nav');
      if (dNav) {
        dNav.innerHTML = Object.entries(PAGES).map(([k, [ic, t]]) =>
          `<button class="nav ${k === page ? 'active' : ''}" onclick="go('${k}')" title="${t}">
            <span class="nav-icon">${ic}</span>
            <span class="txt">${t}</span>
            ${k === 'alerts' && n ? `<span class="dot">${n}</span>` : ''}
          </button>`
        ).join('');
      }
      // Mobile drawer nav
      const mNav = $('#mobileNav');
      if (mNav) {
        mNav.innerHTML = Object.entries(PAGES).map(([k, [ic, t]]) =>
          `<button class="mobile-nav-item ${k === page ? 'active' : ''}" onclick="go('${k}')">
            <span>${ic}</span>
            <span class="txt">${t}</span>
            ${k === 'alerts' && n ? `<span class="dot">${n}</span>` : ''}
          </button>`
        ).join('');
      }
      // Mobile FAB badge
      const fabDot = $('#fabDot');
      if (fabDot) {
        if (n > 0) {
          fabDot.textContent = n;
          fabDot.classList.add('show');
        } else {
          fabDot.classList.remove('show');
        }
      }
      // Mobile status sync text
      const mobSync = $('#mobileSyncStatus');
      const syncEl = $('#sync');
      if (mobSync && syncEl) {
        mobSync.textContent = syncEl.textContent;
      }
    }
    function render() {
      Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k] });
      const [, t, fn] = PAGES[page]; $('#pageTitle').textContent = t;
      $('#refInfo').textContent = `ข้อมูล ณ ${dLabel(today())} · กำลังดู ${ymLabel(curYM)}`;
      const r = fn(); $('#content').innerHTML = r.html; r.after && r.after(); renderNav();
    }
    curYM = ymOf(today());
    const ms = $('#monthSel');
    if (ms) {
      ms.value = curYM;
      ms.onchange = e => { if (e.target.value) { curYM = e.target.value; render() } };
    }
    // Restore sidebar state
    if (localStorage.getItem('mm-sidebar-collapsed') === '1') {
      document.body.classList.add('sidebar-collapsed');
      const btn = $('#collapseBtn');
      if (btn) btn.textContent = '▶';
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal();
        closeDetailModal();
        closeMobileMenu();
      }
    });
    render();
    pull();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !saveT) pull() });

  </script>
</body>

</html>
